<!doctype html><meta charset="utf-8">
<!-- Gera o pattern "redemoinhos" (tile contínuo) com o pincel sumi-ê: pinceladas afinadas nas pontas
     seguindo um campo de vórtices, como a água girando contra a carpa. O PNG fica em window.__png -->
<canvas id="c"></canvas>
<script type="module">
import { makeStroke, drawStroke, taper, rng } from '../assets/js/sumi.js';
const T = 1400, c = document.getElementById('c'); c.width = c.height = T;
const ctx = c.getContext('2d');
const R = rng(1974);
// vórtices em grade deslocada; sentidos alternados, como no avental e no dólmã
const V = [];
const n = 3;
for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
  V.push({ x: (i + .5 + (j % 2) * .5 + (R() - .5) * .25) * T / n, y: (j + .5 + (R() - .5) * .25) * T / n, s: ((i + j) % 2 ? 1 : -1) * (.8 + R() * .4), r: T / n * (.42 + R() * .12) });
}
const wrap = (d) => d - T * Math.round(d / T);
function field(x, y) {
  let vx = .35, vy = 0; // leve correnteza horizontal
  for (const v of V) {
    const dx = wrap(x - v.x), dy = wrap(y - v.y), d = Math.hypot(dx, dy) + 1;
    const k = v.s * Math.exp(-(d * d) / (2 * v.r * v.r)) * 1.6;
    vx += -dy / d * k; vy += dx / d * k;
  }
  const l = Math.hypot(vx, vy) || 1; return [vx / l, vy / l];
}
function streamline(x, y, len) {
  const step = 4, half = Math.round(len / step / 2), pts = [];
  // para quando a pincelada curva demais (nada de círculos fechados)
  const walk = (sx, sy, dir) => { const out = []; let px = sx, py = sy, turn = 0, prev = null; for (let i = 0; i < half; i++) { const [vx, vy] = field(px, py); const a = Math.atan2(vy, vx); if (prev !== null) { let d = a - prev; d -= Math.PI * 2 * Math.round(d / (Math.PI * 2)); turn += Math.abs(d); if (turn > 1.3) break; } prev = a; px += vx * step * dir; py += vy * step * dir; out.push({ x: px, y: py }); } return out; };
  const back = walk(x, y, -1).reverse(), fwd = walk(x, y, 1);
  return [...back, { x, y }, ...fwd];
}
// sementes: grade jitter com distância mínima
const seeds = [], G = 10;
for (let j = 0; j < G; j++) for (let i = 0; i < G; i++) seeds.push({ x: (i + R()) * T / G, y: (j + R()) * T / G });
for (const sd of seeds) {
  if (V.some((v) => Math.hypot(wrap(sd.x - v.x), wrap(sd.y - v.y)) < 90)) continue;
  if (false) continue;
  const len = 150 + R() * 150, wmax = 20 + R() * 12;
  const line = streamline(sd.x, sd.y, len);
  if (line.length < 20) continue;
  const pts = line.map((p, i) => ({ ...p, w: wmax * taper(i / (line.length - 1), .3, .45) }));
  const st = makeStroke(pts, { bristles: 30, seed: Math.floor(R() * 1e6), dry: .3, thin: .2 });
  for (const ox of [-T, 0, T]) for (const oy of [-T, 0, T]) {
    if ((ox && Math.abs(sd.x + ox - T / 2) > T / 2 + 120) || (oy && Math.abs(sd.y + oy - T / 2) > T / 2 + 120)) continue;
    ctx.save(); ctx.translate(ox, oy); drawStroke(ctx, st, 1, '#fff'); ctx.restore();
  }
}
window.__png = c.toDataURL('image/png');
</script>
